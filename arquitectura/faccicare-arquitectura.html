<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACCI Care — Arquitectura interactiva</title>
<meta name="description" content="Mapa interactivo de la arquitectura de FACCI Care: componentes, dependencias y flujos de negocio resaltables.">
<style>
/* ─────────────────────────────────────────────────────────────
   Tokens
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#eef2f7;
  --border:#dfe5ee;
  --border-strong:#c6d0de;
  --text:#16202e;
  --text-2:#54637a;
  --text-3:#8794a8;
  --accent:#0f766e;
  --accent-soft:#d6f2ee;
  --accent-text:#0b5a54;
  --shadow:0 1px 2px rgba(16,26,40,.06), 0 8px 24px -12px rgba(16,26,40,.18);
  --shadow-lg:0 12px 40px -12px rgba(16,26,40,.30);
  --radius:14px;

  --l-actor:#3f6ae0;
  --l-acceso:#8054d8;
  --l-auth:#0e9aa0;
  --l-clinico:#e2603c;
  --l-soporte:#d99414;
  --l-portal:#d64593;
  --l-servicio:#1f9d63;
  --l-datos:#61718c;

  --edge:#9aa8bd;
  --edge-hl:#0f766e;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1219;
    --surface:#141c26;
    --surface-2:#1a232f;
    --surface-3:#212c3a;
    --border:#27333f;
    --border-strong:#3a4757;
    --text:#e8eef6;
    --text-2:#a3b1c4;
    --text-3:#75849a;
    --accent:#37bfae;
    --accent-soft:#12312e;
    --accent-text:#7fe0d1;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 12px 40px -12px rgba(0,0,0,.7);

    --l-actor:#7d9bff;
    --l-acceso:#b18cff;
    --l-auth:#3fd0d6;
    --l-clinico:#ff9273;
    --l-soporte:#f0be55;
    --l-portal:#ff7ec0;
    --l-servicio:#4fd193;
    --l-datos:#9aabc4;

    --edge:#5b6b81;
    --edge-hl:#37bfae;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--accent-soft);color:var(--accent-text)}

/* ─────────────────────────────────────────────────────────────
   Estructura
   ───────────────────────────────────────────────────────────── */
.shell{min-height:100%;display:flex;flex-direction:column}
@media (min-width:961px){
  /* La aplicación ocupa exactamente la ventana: el panel desplaza su propio
     contenido y el lienzo conserva una altura estable para el encuadre. */
  html,body{overflow:hidden}
  .shell{height:100vh;height:100dvh}
  .main{min-height:0}
  .stage{min-height:0}
  .panel{min-height:0}
}

.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(140deg,var(--accent),#3fbfa8);
  color:#fff;display:grid;place-items:center;font-weight:700;letter-spacing:.5px;font-size:13px;
}
.brand h1{margin:0;font-size:17px;font-weight:660;letter-spacing:-.2px;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--text-2)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{
  background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
  padding:5px 10px;font-size:12px;color:var(--text-2);white-space:nowrap;
}
.stat b{color:var(--text);font-weight:640;font-variant-numeric:tabular-nums}
.topbar-actions{display:flex;gap:8px}

.btn{
  background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
  padding:6px 12px;font-size:13px;color:var(--text-2);transition:.14s;white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}

.toolbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 20px;background:var(--surface-2);border-bottom:1px solid var(--border);
}
.toolbar-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);font-weight:640}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kind{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  border:1px solid var(--border);background:var(--surface);border-radius:20px;
  padding:4px 11px 4px 8px;font-size:12.5px;color:var(--text-2);transition:.14s;
}
.kind:hover{border-color:var(--border-strong)}
.kind input{position:absolute;opacity:0;width:0;height:0}
.kind .swatch{width:22px;height:2px;border-radius:2px;background:var(--edge);flex:none}
.kind.on{background:var(--surface-3);color:var(--text);border-color:var(--border-strong)}
.kind.on .swatch{background:var(--text-2)}
.kind:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.zoomgroup{margin-left:auto;display:flex;gap:6px;align-items:center}
.zoom-btn{width:32px;height:32px;display:grid;place-items:center;padding:0;font-size:15px}

.main{
  flex:1;display:grid;grid-template-columns:minmax(0,1fr) 392px;
  gap:0;min-height:0;
}

/* ── Escenario ─────────────────────────────────────────────── */
.stage{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.canvas-wrap{position:relative;flex:1;min-height:340px;overflow:hidden}
#diagram{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#diagram.dragging{cursor:grabbing}
.hint{
  position:absolute;left:16px;bottom:14px;z-index:4;transition:opacity .4s;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  border:1px solid var(--border);border-radius:9px;padding:5px 10px;
  font-size:11.5px;color:var(--text-3);backdrop-filter:blur(6px);pointer-events:none;
}
.legend{
  display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;
  background:var(--surface);border-top:1px solid var(--border);
}
.leg{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);
  border:1px solid transparent;border-radius:20px;padding:3px 10px 3px 7px;background:transparent;transition:.14s;
}
.leg:hover{background:var(--surface-2);border-color:var(--border)}
.leg.active{background:var(--surface-3);border-color:var(--border-strong);color:var(--text)}
.leg .dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}

/* ── Tooltip ───────────────────────────────────────────────── */
.tip{
  position:absolute;z-index:20;max-width:310px;pointer-events:none;opacity:0;
  transform:translateY(4px);transition:opacity .12s, transform .12s;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:11px;
  box-shadow:var(--shadow-lg);padding:11px 13px;
}
.tip.show{opacity:1;transform:translateY(0)}
.tip h4{margin:0;font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:7px}
.tip h4 .dot{width:8px;height:8px;border-radius:3px;background:var(--c);flex:none}
.tip .path{margin:4px 0 0;font-size:11px;color:var(--text-3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.tip p{margin:7px 0 0;font-size:12.5px;color:var(--text-2);line-height:1.45}
.tip .cue{margin:8px 0 0;font-size:11px;color:var(--text-3)}

/* ── Panel ─────────────────────────────────────────────────── */
.panel{
  background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
}
.tabs{display:flex;gap:4px;padding:12px 16px 0}
.tab{
  flex:1;background:transparent;border:0;border-bottom:2px solid transparent;
  padding:8px 4px 10px;font-size:13.5px;color:var(--text-3);font-weight:600;transition:.14s;
}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.panel-search{padding:12px 16px 8px}
.panel-search input{
  width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font:inherit;font-size:13.5px;
}
.panel-search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.panel-body{flex:1;overflow-y:auto;padding:4px 16px 24px;scrollbar-width:thin}
.panel-body::-webkit-scrollbar{width:9px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;border:2px solid var(--surface)}

.group-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-3);
  font-weight:700;margin:16px 0 7px;padding-left:2px;
}
.flow{
  width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:11px 13px;margin-bottom:7px;transition:.14s;display:block;
}
.flow:hover{border-color:var(--border-strong);background:var(--surface-3)}
.flow.on{border-color:var(--accent);background:var(--accent-soft)}
.flow.on .flow-name{color:var(--accent-text)}
.flow-name{font-size:13.8px;font-weight:640;line-height:1.3}
.flow-meta{margin-top:4px;font-size:11.5px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--text-2)}
.flow.on .pill{background:var(--surface);border-color:var(--border-strong)}

.detail{padding-top:10px}
.detail h2{margin:0 0 3px;font-size:17px;font-weight:660;letter-spacing:-.2px}
.detail .sub{margin:0;font-size:12.5px;color:var(--text-2)}
.detail .mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  color:var(--text-3);word-break:break-all;margin:6px 0 0;
}
.detail .lead{margin:12px 0 0;font-size:13.5px;color:var(--text-2);line-height:1.55}
.section{margin-top:18px}
.section h3{
  margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-3);font-weight:700;
}
.section ul{margin:0;padding-left:17px}
.section li{font-size:13px;color:var(--text-2);margin-bottom:6px;line-height:1.5}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
  padding:3px 9px;font-size:12px;color:var(--text-2);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.chip.link{cursor:pointer}
.chip.link:hover{border-color:var(--accent);color:var(--accent-text)}

.steps{list-style:none;margin:14px 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:13px;top:12px;bottom:12px;width:2px;background:var(--border)}
.step{position:relative;padding:0 0 14px 38px}
.step-btn{
  width:100%;text-align:left;background:transparent;border:0;padding:2px 0;border-radius:8px;
}
.step-btn:hover .step-title{color:var(--accent-text)}
.step-num{
  position:absolute;left:0;top:0;width:27px;height:27px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border-strong);color:var(--text-2);
  display:grid;place-items:center;font-size:12px;font-weight:660;z-index:1;
  font-variant-numeric:tabular-nums;transition:.14s;
}
.step.on .step-num{background:var(--accent);border-color:var(--accent);color:#fff}
.step-title{font-size:13.4px;font-weight:620;line-height:1.35;transition:.14s}
.step-node{
  display:inline-flex;align-items:center;gap:6px;margin-top:4px;
  font-size:11.5px;color:var(--text-3);
}
.step-node .dot{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.step-detail{margin:5px 0 0;font-size:12.7px;color:var(--text-2);line-height:1.5}
.step-ref{
  display:inline-block;margin-top:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);
  border-radius:6px;padding:1px 7px;
}
.empty{padding:28px 6px;text-align:center;color:var(--text-3);font-size:13px}
.backlink{
  background:transparent;border:0;padding:0;margin-bottom:12px;
  font-size:12.5px;color:var(--accent-text);font-weight:600;
}
.backlink:hover{text-decoration:underline}
.note{
  margin-top:18px;padding:11px 13px;border-radius:11px;
  background:var(--surface-2);border:1px solid var(--border);
  font-size:12.3px;color:var(--text-2);line-height:1.5;
}
.note b{color:var(--text)}

/* ─────────────────────────────────────────────────────────────
   SVG
   ───────────────────────────────────────────────────────────── */
.edge{pointer-events:none}
.edge-hit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
.edge-line{
  fill:none;stroke:var(--edge);stroke-width:1.5;opacity:.55;
  transition:opacity .18s, stroke .18s, stroke-width .18s;
}
.edge{pointer-events:auto}
.edge-label{
  font-size:10.5px;fill:var(--text-2);opacity:0;pointer-events:none;
  paint-order:stroke fill;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;
  transition:opacity .18s;text-anchor:middle;
}
.edge.hover .edge-line{stroke:var(--text-2);opacity:1;stroke-width:2}
.edge.hl .edge-line{
  stroke:var(--edge-hl);opacity:1;stroke-width:2.6;
  stroke-dasharray:9 7;animation:march 1.1s linear infinite;
}
.edge.dim .edge-line{opacity:.09}
.edge.off{display:none}
/* Los rótulos viven en una capa por encima de los nodos para que nunca queden tapados */
.edge-label.on{opacity:1}
.edge-label.strong{fill:var(--text)}
.edge-label.off{display:none}
@keyframes march{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion: reduce){
  .edge.hl .edge-line{animation:none}
}

.node{cursor:pointer}
.node .node-bg{
  fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2;
  transition:stroke .18s, filter .18s;
}
.node .node-accent{fill:var(--c)}
.node .node-label{
  font-size:13.5px;font-weight:640;fill:var(--text);dominant-baseline:middle;
}
.node .node-sub{font-size:10.8px;fill:var(--text-3);dominant-baseline:middle}
.node:hover .node-bg{stroke:var(--c);stroke-width:2}
.node:focus{outline:none}
.node:focus-visible .node-bg{stroke:var(--accent);stroke-width:2.4}
.node.dim{opacity:.2}
.node.hl .node-bg{stroke:var(--c);stroke-width:2.4;filter:drop-shadow(0 4px 14px rgba(15,118,110,.22))}
.node.sel .node-bg{stroke:var(--accent);stroke-width:2.8}
.node.off{display:none}
.badge{opacity:0;transition:opacity .18s}
.node.hl .badge{opacity:1}
.badge circle{fill:var(--edge-hl);stroke:var(--surface);stroke-width:2}
.badge text{
  fill:#fff;font-size:11px;font-weight:700;text-anchor:middle;
  dominant-baseline:central;font-variant-numeric:tabular-nums;
}
.layer-title{
  font-size:10.5px;fill:var(--text-3);font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;
}

/* ─────────────────────────────────────────────────────────────
   Responsive
   ───────────────────────────────────────────────────────────── */
@media (max-width:1180px){
  .main{grid-template-columns:minmax(0,1fr) 340px}
}
@media (max-width:960px){
  .main{grid-template-columns:1fr;grid-template-rows:auto auto}
  .panel{border-left:0;border-top:1px solid var(--border);max-height:none}
  .canvas-wrap{min-height:58vh}
  .stats{width:100%;margin-left:0;order:3}
  .panel-body{max-height:none;overflow:visible}
}
@media (max-width:640px){
  .topbar{padding:12px 14px;gap:12px}
  .toolbar{padding:9px 14px;flex-wrap:nowrap;gap:10px}
  /* En pantallas estrechas las capas y los indicadores se desplazan en una sola línea */
  .kinds,.stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .kinds::-webkit-scrollbar,.stats::-webkit-scrollbar{display:none}
  .kind,.stat{flex:none}
  .toolbar-label{display:none}
  .zoomgroup{position:sticky;right:0;background:var(--surface-2);padding-left:6px}
  .legend{padding:10px 14px}
  .panel-search,.tabs{padding-left:14px;padding-right:14px}
  .panel-body{padding-left:14px;padding-right:14px}
  .brand h1{font-size:15.5px;white-space:normal}
  .canvas-wrap{min-height:56vh}
  .hint{font-size:11px;left:10px;bottom:10px;right:10px}
}

@media print{
  .topbar-actions,.toolbar,.hint,.tabs,.panel-search{display:none}
  .main{grid-template-columns:1fr}
  .panel{border:0}
  body{background:#fff}
  .canvas-wrap{min-height:150mm;border:1px solid #ccc}
}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">FC</div>
      <div>
        <h1>FACCI Care — Arquitectura interactiva</h1>
        <p>Detección temprana de cáncer pediátrico · Django · República Dominicana</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="topbar-actions">
      <button class="btn" id="btn-json" title="Descargar el grafo en JSON">Descargar JSON</button>
      <button class="btn primary" id="btn-reset">Reiniciar vista</button>
    </div>
  </header>

  <div class="toolbar">
    <span class="toolbar-label">Capas</span>
    <div class="kinds" id="kinds"></div>
    <div class="zoomgroup">
      <button class="btn zoom-btn" id="zoom-out" aria-label="Alejar" title="Alejar">−</button>
      <button class="btn zoom-btn" id="zoom-in" aria-label="Acercar" title="Acercar">+</button>
      <button class="btn" id="zoom-fit" title="Ajustar a la pantalla">Ajustar</button>
    </div>
  </div>

  <div class="main">
    <section class="stage">
      <div class="canvas-wrap" id="canvas-wrap">
        <svg id="diagram" role="img" aria-label="Diagrama de arquitectura de FACCI Care">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="var(--edge)" opacity=".7"></path>
            </marker>
            <marker id="ar-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="var(--edge-hl)"></path>
            </marker>
            <marker id="ar-hover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="var(--text-2)"></path>
            </marker>
            <marker id="ar-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,1 L9,5 L0,9 z" fill="var(--edge)" opacity=".1"></path>
            </marker>
          </defs>
          <g id="viewport">
            <g id="g-bands"></g>
            <g id="g-edges"></g>
            <g id="g-nodes"></g>
            <g id="g-labels"></g>
          </g>
        </svg>
        <div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
        <div class="hint">Arrastra para mover · rueda o pellizco para acercar · clic en un componente para ver su detalle</div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button class="tab on" id="tab-flows" role="tab" aria-selected="true">Flujos</button>
        <button class="tab" id="tab-detail" role="tab" aria-selected="false">Componente</button>
      </div>
      <div class="panel-search" id="search-wrap">
        <input type="search" id="search" placeholder="Buscar flujo o componente…" aria-label="Buscar">
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </div>
</div>

<script type="application/json" id="graph-data">{
  "meta": {
    "proyecto": "FACCI Care",
    "descripcion": "Sistema web de detección temprana, referencia oportuna y seguimiento clínico de cáncer pediátrico (República Dominicana). Integra el portal clínico, el portal de padres/tutores y la operación de la Fundación (FACCI).",
    "version_grafo": "1.0.0",
    "generado": "2026-08-04",
    "repositorio": "alanaquino/faccicare",
    "stack": [
      "Python / Django 6.0",

  const s = NODE[e.source], t = NODE[e.target];

    const push = (nodeId, side, otherY) => {
      const key = nodeId + '|' + side;
      (buckets[key] = buckets[key] || []).push({ id: e.id, otherY, nodeId, side });
    };
    push(e.source, sd.s, NODE[e.target].y);
    push(e.target, sd.t, NODE[e.source].y);
  });
  Object.values(buckets).forEach(list => {
    list.sort((a, b) => a.otherY - b.otherY);
    const n = NODE[list[0].nodeId];
    const span = Math.max(0, n.h - 18);
    const gap = list.length > 1 ? Math.min(13, span / (list.length - 1)) : 0;
    list.forEach((item, i) => {
      const y = n.y + (i - (list.length - 1) / 2) * gap;
      anchors[item.id + '|' + item.side + '|' + item.nodeId] = y;
    });
  });
})();
function anchorY(edgeId, side, nodeId){
  return anchors[edgeId + '|' + side + '|' + nodeId] ?? NODE[nodeId].y;
}
function pathFor(e){
  const s = NODE[e.source], t = NODE[e.target], sd = sideOf(e);
  const y0 = anchorY(e.id, sd.s, e.source), y1 = anchorY(e.id, sd.t, e.target);
  const sx = sd.s === 'R' ? s.x + s.w / 2 : s.x - s.w / 2;
  const tx = sd.t === 'R' ? t.x + t.w / 2 : t.x - t.w / 2;
  if (sd.s === 'L' && sd.t === 'L'){                      // misma columna
    return `M${sx},${y0} C${sx - BULGE},${y0} ${tx - BULGE},${y1} ${tx},${y1}`;
  }
  if (sd.s === 'R'){                                       // izquierda → derecha
    const dx = Math.max(42, (tx - sx) * 0.55);
    return `M${sx},${y0} C${sx + dx},${y0} ${tx - dx},${y1} ${tx},${y1}`;
  }
  const bow = Math.abs(y1 - y0) < 46 ? 52 : 0;             // derecha → izquierda
  const dx = Math.max(54, (sx - tx) * 0.34);
  return `M${sx},${y0} C${sx - dx},${y0 + bow} ${tx + dx},${y1 + bow} ${tx},${y1}`;
}

/* ── Render del diagrama ──────────────────────────────────── */
function truncate(textEl, str, maxWidth){
  textEl.textContent = str;
  if (textEl.getComputedTextLength() <= maxWidth) return;
  let s = str;
  while (s.length > 3 && textEl.getComputedTextLength() > maxWidth){
    s = s.slice(0, -1);
    textEl.textContent = s + '…';
  }
}

const edgeEls = {}, nodeEls = {};

function renderEdges(){
  EDGES.forEach(e => {
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'edge');
    g.dataset.id = e.id;
    g.dataset.kind = e.kind;

    const d = pathFor(e);
    const hit = document.createElementNS(SVGNS, 'path');
    hit.setAttribute('class', 'edge-hit');
    hit.setAttribute('d', d);

    const line = document.createElementNS(SVGNS, 'path');
    line.setAttribute('class', 'edge-line');
    line.setAttribute('d', d);
    line.setAttribute('marker-end', 'url(#ar)');
    const kind = DATA.edgeKinds.find(k => k.id === e.kind);
    if (kind && kind.dash) line.setAttribute('stroke-dasharray', kind.dash);

    const label = document.createElementNS(SVGNS, 'text');
    label.setAttribute('class', 'edge-label');
    label.textContent = e.label || '';

    g.append(hit, line);
    el.gEdges.appendChild(g);
    el.gLabels.appendChild(label);

    const len = line.getTotalLength();
    const mid = line.getPointAtLength(len / 2);
    label.setAttribute('x', mid.x);
    label.setAttribute('y', mid.y - 7);

    edgeEls[e.id] = { g, line, label };

    g.addEventListener('mouseenter', () => {
      g.classList.add('hover');
      if (!g.classList.contains('hl')){
        line.setAttribute('marker-end', 'url(#ar-hover)');
        if (!g.classList.contains('dim')) label.classList.add('on');
      }
      showEdgeTip(e);
    });
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', () => {
      g.classList.remove('hover');
      if (!g.classList.contains('hl')){
        line.setAttribute('marker-end', g.classList.contains('dim') ? 'url(#ar-dim)' : 'url(#ar)');
        label.classList.remove('on');
      }
      hideTip();
    });
  });
}

function renderNodes(){

    accent.setAttribute('rx', 2);

/* ── Tooltip ──────────────────────────────────────────────── */
function showNodeTip(n){
  const layer = LAYER[n.layer];
  el.tip.style.setProperty('--c', layer.color);
  el.tip.innerHTML =
    `<h4><span class="dot"></span>${esc(n.label)}</h4>` +
    `<p class="path">${esc(n.path || '')}</p>` +
    `<p>${esc(n.summary || '')}</p>` +
    `<p class="cue">${layer.label}${n.acceso ? ' · acceso restringido' : ''} — clic para ver el detalle</p>`;
  el.tip.classList.add('show');
  el.tip.setAttribute('aria-hidden', 'false');
}
function showEdgeTip(e){
  const layer = LAYER[NODE[e.source].layer];
  el.tip.style.setProperty('--c', layer.color);
  const kind = DATA.edgeKinds.find(k => k.id === e.kind);
  el.tip.innerHTML =
    `<h4><span class="dot"></span>${esc(NODE[e.source].label)} → ${esc(NODE[e.target].label)}</h4>` +
    `<p>${esc(e.label || '')}</p>` +
    (e.detail ? `<p>${esc(e.detail)}</p>` : '') +
    `<p class="cue">${kind ? esc(kind.label) : ''}</p>`;
  el.tip.classList.add('show');
  el.tip.setAttribute('aria-hidden', 'false');
}
function moveTip(ev){
  const r = el.wrap.getBoundingClientRect();
  let x = ev.clientX - r.left + 16, y = ev.clientY - r.top + 16;
  const tw = el.tip.offsetWidth, th = el.tip.offsetHeight;
  if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 16;
  if (y + th > r.height - 8) y = Math.max(8, ev.clientY - r.top - th - 16);
  el.tip.style.left = x + 'px';
  el.tip.style.top = y + 'px';
}
function hideTip(){
  el.tip.classList.remove('show');
  el.tip.setAttribute('aria-hidden', 'true');
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ── Estados visuales ─────────────────────────────────────── */
function applyKindVisibility(){
  const forcedSet = state.flow ? currentFlowEdges() : null;
  EDGES.forEach(e => {
    const hidden = !(forcedSet && forcedSet.has(e.id)) && !state.kinds.has(e.kind);
    edgeEls[e.id].g.classList.toggle('off', hidden);
    edgeEls[e.id].label.classList.toggle('off', hidden);
  });
}
function currentFlowEdges(){
  const f = FLOWS.find(x => x.id === state.flow);
  return new Set(f ? f.steps.filter(s => s.edge).map(s => s.edge) : []);
}
function currentFlowNodes(){
  const f = FLOWS.find(x => x.id === state.flow);
  return new Set(f ? f.steps.map(s => s.node) : []);
}

function paint(){
  const flow = FLOWS.find(f => f.id === state.flow);
  const hlNodes = new Set(), hlEdges = new Set();
  const badges = {};

  if (flow){
    flow.steps.forEach(s => {
      hlNodes.add(s.node);
      if (s.edge) hlEdges.add(s.edge);
      if (!badges[s.node]) badges[s.node] = s.n;
    });
  } else if (state.node){
    hlNodes.add(state.node);
    (edgesByNode[state.node] || []).forEach(e => {
      if (!state.kinds.has(e.kind)) return;
      hlEdges.add(e.id);
      hlNodes.add(e.source); hlNodes.add(e.target);
    });
  } else if (state.layerFilter){
    NODES.forEach(n => { if (n.layer === state.layerFilter) hlNodes.add(n.id); });
  }

  const anyFocus = hlNodes.size > 0;

  NODES.forEach(n => {
    const { g, badgeText } = nodeEls[n.id];
    const isHl = hlNodes.has(n.id);
    g.classList.toggle('hl', anyFocus && isHl && (!!flow || !!state.layerFilter || n.id !== state.node));
    g.classList.toggle('sel', state.node === n.id);
    g.classList.toggle('dim', anyFocus && !isHl);
    if (flow && badges[n.id] != null){
      badgeText.textContent = badges[n.id];
      g.classList.add('hl');
    } else if (!flow){
      badgeText.textContent = '';
    }
  });
  // el badge solo tiene sentido dentro de un flujo
  NODES.forEach(n => {
    nodeEls[n.id].g.querySelector('.badge').style.display = (flow && badges[n.id] != null) ? '' : 'none';
  });

  EDGES.forEach(e => {
    const { g, line, label } = edgeEls[e.id];
    const isHl = hlEdges.has(e.id);
    g.classList.toggle('hl', isHl);
    g.classList.toggle('dim', anyFocus && !isHl);
    label.classList.toggle('on', isHl);
    label.classList.toggle('strong', isHl);
    line.setAttribute('marker-end', isHl ? 'url(#ar-hl)' : (anyFocus && !isHl ? 'url(#ar-dim)' : 'url(#ar)'));
  });

  applyKindVisibility();
}

/* ── Zoom y desplazamiento ────────────────────────────────── */
function applyView(){
  el.vp.setAttribute('transform', `translate(${state.view.x},${state.view.y}) scale(${state.view.k})`);
}
function bounds(list){
  const ns = list && list.length ? list.map(id => NODE[id]).filter(Boolean) : NODES;
  return {
    x0: Math.min(...ns.map(n => n.x - n.w / 2)),
    x1: Math.max(...ns.map(n => n.x + n.w / 2)),
    y0: Math.min(...ns.map(n => n.y - n.h / 2)) - (list ? 0 : 24), // deja sitio a los rótulos de columna
    y1: Math.max(...ns.map(n => n.y + n.h / 2))
  };
}
function fitTo(list, pad, maxK){
  const r = el.wrap.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const p = pad == null ? 44 : pad;
  const b = bounds(list);
  const w = Math.max(1, b.x1 - b.x0), h = Math.max(1, b.y1 - b.y0);
  // En pantallas estrechas nunca se reduce por debajo de un tamaño legible:
  // es preferible desplazar el lienzo a leer un diagrama diminuto.
  const minK = r.width < 720 ? 0.52 : 0.22;
  const k = Math.min((r.width - p * 2) / w, (r.height - p * 2) / h);
  state.view.k = Math.max(minK, Math.min(maxK == null ? 2.2 : maxK, k));
  const scaledW = w * state.view.k, scaledH = h * state.view.k;
  state.view.x = (scaledW > r.width - p ? p : (r.width - scaledW) / 2) - b.x0 * state.view.k;
  state.view.y = (scaledH > r.height - p ? p / 2 : (r.height - scaledH) / 2) - b.y0 * state.view.k;
  applyView();
}
function fit(){ fitTo(null); }
function zoomBy(factor, cx, cy){
  const r = el.wrap.getBoundingClientRect();
  const px = cx == null ? r.width / 2 : cx;
  const py = cy == null ? r.height / 2 : cy;
  const k0 = state.view.k;
  const k1 = Math.max(0.25, Math.min(3.2, k0 * factor));
  state.view.x = px - (px - state.view.x) * (k1 / k0);
  state.view.y = py - (py - state.view.y) * (k1 / k0);
  state.view.k = k1;
  applyView();
}
function centerOn(nodeId, zoom){
  const n = NODE[nodeId];
  if (!n) return;
  const r = el.wrap.getBoundingClientRect();
  if (zoom) state.view.k = Math.max(state.view.k, 0.85);
  state.view.x = r.width / 2 - n.x * state.view.k;
  state.view.y = r.height / 2 - n.y * state.view.k;
  applyView();
}
(function bindPanZoom(){
  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
  const pointers = new Map();     // arrastre con un dedo, pellizco con dos
  let pinchDist = 0;

  const dist = () => {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };
  const mid = () => {
    const [a, b] = [...pointers.values()];
    const r = el.wrap.getBoundingClientRect();
    return { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
  };

  el.svg.addEventListener('pointerdown', ev => {
    if (el.hint) el.hint.style.opacity = '0';   // la pista desaparece tras la primera interacción
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size === 2){ dragging = false; pinchDist = dist(); el.svg.classList.remove('dragging'); return; }
    if (ev.target.closest('.node') || ev.target.closest('.edge')) return;
    dragging = true; moved = false;
    sx = ev.clientX; sy = ev.clientY; ox = state.view.x; oy = state.view.y;
    el.svg.classList.add('dragging');
    el.svg.setPointerCapture(ev.pointerId);
  });
  el.svg.addEventListener('pointermove', ev => {
    if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size === 2){
      const d = dist();
      if (pinchDist > 0 && d > 0){
        const m = mid();
        zoomBy(d / pinchDist, m.x, m.y);
      }
      pinchDist = d;
      return;
    }
    if (!dragging) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    state.view.x = ox + dx; state.view.y = oy + dy;
    applyView();
  });
  const end = ev => {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (!dragging) return;
    dragging = false;
    el.svg.classList.remove('dragging');
    try { el.svg.releasePointerCapture(ev.pointerId); } catch (_){}
  };
  el.svg.addEventListener('pointerup', ev => {
    const wasMoved = moved, wasDragging = dragging;
    end(ev);
    if (wasDragging && !wasMoved && !ev.target.closest('.node') && !ev.target.closest('.edge')) clearSelection();
  });
  el.svg.addEventListener('pointercancel', end);
  el.svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = el.wrap.getBoundingClientRect();
    zoomBy(ev.deltaY < 0 ? 1.12 : 1 / 1.12, ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });
})();

/* ── Panel ────────────────────────────────────────────────── */
function setTab(tab){
  state.tab = tab;
  el.tabFlows.classList.toggle('on', tab === 'flows');
  el.tabDetail.classList.toggle('on', tab === 'detail');
  el.tabFlows.setAttribute('aria-selected', String(tab === 'flows'));
  el.tabDetail.setAttribute('aria-selected', String(tab === 'detail'));
  el.searchWrap.style.display = tab === 'flows' ? '' : 'none';
  renderPanel();
}

function renderPanel(){
  if (state.tab === 'detail') return renderDetail();
  if (state.flow) return renderFlowDetail();
  renderFlowList();
}

function renderFlowList(){
  const q = el.search.value.trim().toLowerCase();
  const match = f => !q || (f.name + ' ' + f.description + ' ' + f.category + ' ' + f.actor +
    ' ' + f.steps.map(s => s.title + ' ' + s.detail).join(' ')).toLowerCase().includes(q);

  const shown = FLOWS.filter(match);
  const cats = [];
  shown.forEach(f => { if (!cats.includes(f.category)) cats.push(f.category); });

  let html = '';
  if (!shown.length){
    html = '<p class="empty">Ningún flujo coincide con la búsqueda.</p>';
  } else {
    cats.forEach(cat => {
      html += `<div class="group-title">${esc(cat)}</div>`;
      shown.filter(f => f.category === cat).forEach(f => {
        html += `<button class="flow" data-flow="${f.id}">
          <div class="flow-name">${esc(f.name)}</div>
          <div class="flow-meta"><span class="pill">${f.steps.length} pasos</span><span>${esc(f.actor)}</span></div>
        </button>`;
      });
    });
  }
  // componentes que coinciden con la búsqueda
  if (q){
    const nodes = NODES.filter(n => (n.label + ' ' + (n.sublabel || '') + ' ' + (n.summary || '') + ' ' + (n.path || '')).toLowerCase().includes(q));
    if (nodes.length){
      html += `<div class="group-title">Componentes</div>`;
      nodes.forEach(n => {
        html += `<button class="flow" data-node="${n.id}">
          <div class="flow-name">${esc(n.label)}</div>
          <div class="flow-meta"><span class="pill">${esc(LAYER[n.layer].label)}</span><span>${esc(n.path || '')}</span></div>
        </button>`;
      });
    }
  }
  html += `<div class="note"><b>Cómo leerlo.</b> Selecciona un flujo para resaltar su ruta completa sobre el diagrama; los números indican el orden de los pasos. Las capas de <i>control de acceso</i>, <i>auditoría</i>, <i>cifrado</i> y <i>persistencia</i> están ocultas por defecto y se activan desde la barra superior, pero cualquier flujo las muestra si las recorre.</div>`;
  el.body.innerHTML = html;
}

function renderFlowDetail(){
  const f = FLOWS.find(x => x.id === state.flow);
  if (!f) return renderFlowList();
  let html = `<button class="backlink" data-back="1">← Todos los flujos</button>
    <div class="detail">
      <h2>${esc(f.name)}</h2>
      <p class="sub">${esc(f.category)} · ${esc(f.actor)}</p>
      <p class="lead">${esc(f.description)}</p>
      <div class="section"><h3>Resultado</h3><p class="sub">${esc(f.outcome)}</p></div>
      <ol class="steps">`;
  f.steps.forEach((s, i) => {
    const n = NODE[s.node];
    html += `<li class="step ${state.step === i ? 'on' : ''}" style="--c:${LAYER[n.layer].color}">
      <span class="step-num">${s.n}</span>
      <button class="step-btn" data-step="${i}">
        <div class="step-title">${esc(s.title)}</div>
        <div class="step-node"><span class="dot"></span>${esc(n.label)}</div>
        <p class="step-detail">${esc(s.detail)}</p>
        ${s.ref ? `<span class="step-ref">${esc(s.ref)}</span>` : ''}
      </button>
    </li>`;
  });
  html += `</ol></div>`;
  el.body.innerHTML = html;
}

function renderDetail(){
  if (!state.node){
    el.body.innerHTML = '<p class="empty">Selecciona un componente del diagrama para ver su detalle.</p>';
    return;
  }
  const n = NODE[state.node], layer = LAYER[n.layer];
  let html = `<div class="detail">
    <h2>${esc(n.label)}</h2>
    <p class="sub">${esc(layer.label)}${n.sublabel ? ' · ' + esc(n.sublabel) : ''}</p>
    <p class="mono">${esc(n.path || '')}</p>
    <p class="lead">${esc(n.summary || '')}</p>`;

  if (n.detalles && n.detalles.length){
    html += `<div class="section"><h3>Cómo funciona</h3><ul>` +
      n.detalles.map(d => `<li>${esc(d)}</li>`).join('') + `</ul></div>`;
  }
  if (n.modelos && n.modelos.length){
    html += `<div class="section"><h3>Modelos</h3><div class="chips">` +
      n.modelos.map(m => `<span class="chip">${esc(m)}</span>`).join('') + `</div></div>`;
  }
  if (n.rutas && n.rutas.length){
    html += `<div class="section"><h3>Rutas</h3><div class="chips">` +
      n.rutas.map(r => `<span class="chip">${esc(r)}</span>`).join('') + `</div></div>`;
  }
  if (n.acceso){
    html += `<div class="section"><h3>Control de acceso</h3><p class="sub">${esc(n.acceso)}</p></div>`;
  }

  const ins = EDGES.filter(e => e.target === n.id), outs = EDGES.filter(e => e.source === n.id);
  const rel = (list, dir) => list.map(e => {
    const other = dir === 'out' ? NODE[e.target] : NODE[e.source];
    const arrow = dir === 'out' ? '→' : '←';
    return `<li><b style="color:var(--text)">${arrow} ${esc(other.label)}</b> — ${esc(e.label || '')}</li>`;
  }).join('');
  if (outs.length){
    html += `<div class="section"><h3>Sale hacia (${outs.length})</h3><ul>${rel(outs, 'out')}</ul></div>`;
  }
  if (ins.length){
    html += `<div class="section"><h3>Recibe de (${ins.length})</h3><ul>${rel(ins, 'in')}</ul></div>`;
  }

  const fl = Array.from(flowsByNode[n.id] || []);
  if (fl.length){
    html += `<div class="section"><h3>Flujos que lo atraviesan</h3><div class="chips">` +
      fl.map(id => {
        const f = FLOWS.find(x => x.id === id);
        return `<span class="chip link" data-flow="${id}">${esc(f.name)}</span>`;
      }).join('') + `</div></div>`;
  }
  html += `</div>`;
  el.body.innerHTML = html;
}

/* ── Selección ────────────────────────────────────────────── */
function selectFlow(id){
  state.flow = id; state.node = null; state.step = null; state.layerFilter = null;
  updateLegend();
  paint();
  setTab('flows');
  const f = FLOWS.find(x => x.id === id);
  if (f){
    state.step = 0;
    renderPanel();
    fitTo(f.steps.map(s => s.node), 70, 1.35);   // encuadra la ruta completa
  }
  el.body.scrollTop = 0;
}
function selectNode(id){
  state.node = id; state.flow = null; state.step = null; state.layerFilter = null;
  updateLegend();
  paint();
  setTab('detail');
  el.body.scrollTop = 0;
}
function focusStep(i, center){
  const f = FLOWS.find(x => x.id === state.flow);
  if (!f || !f.steps[i]) return;
  state.step = i;
  renderPanel();
  if (center !== false) centerOn(f.steps[i].node, true);
  const g = nodeEls[f.steps[i].node].g;
  g.classList.add('sel');
  setTimeout(() => { if (state.node !== f.steps[i].node) g.classList.remove('sel'); }, 900);
}
function clearSelection(){
  state.flow = null; state.node = null; state.step = null; state.layerFilter = null;
  updateLegend();
  paint();
  setTab('flows');
}

/* ── Controles ────────────────────────────────────────────── */
function buildKinds(){
  el.kinds.innerHTML = DATA.edgeKinds.map(k => `
    <label class="kind ${state.kinds.has(k.id) ? 'on' : ''}" title="${esc(k.descripcion)}">
      <input type="checkbox" value="${k.id}" ${state.kinds.has(k.id) ? 'checked' : ''}>
      <span class="swatch" style="${k.dash ? 'background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px)' : ''}"></span>
      ${esc(k.label)}
    </label>`).join('');
  el.kinds.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      if (inp.checked) state.kinds.add(inp.value); else state.kinds.delete(inp.value);
      inp.closest('.kind').classList.toggle('on', inp.checked);
      paint();
    });
  });
}
function buildLegend(){
  el.legend.innerHTML = DATA.layers.map(l => `
    <button class="leg" data-layer="${l.id}" style="--c:${l.color}" title="${esc(l.descripcion)}">
      <span class="dot"></span>${esc(l.label)}
    </button>`).join('');
  el.legend.querySelectorAll('.leg').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.layer;
      state.layerFilter = state.layerFilter === id ? null : id;
      state.flow = null; state.node = null;
      updateLegend(); paint(); setTab('flows');
    });
  });
}
function updateLegend(){
  el.legend.querySelectorAll('.leg').forEach(b => {
    b.classList.toggle('active', b.dataset.layer === state.layerFilter);
  });
}
function buildStats(){
  const s = DATA.meta.estadisticas;
  el.stats.innerHTML = `
    <span class="stat"><b>${s.apps}</b> apps Django</span>
    <span class="stat"><b>${NODES.length}</b> componentes</span>
    <span class="stat"><b>${EDGES.length}</b> relaciones</span>
    <span class="stat"><b>${FLOWS.length}</b> flujos</span>
    <span class="stat"><b>${s.plantillas_html}</b> plantillas</span>`;
}

el.body.addEventListener('click', ev => {
  const flowBtn = ev.target.closest('[data-flow]');
  if (flowBtn){ selectFlow(flowBtn.dataset.flow); return; }
  const nodeBtn = ev.target.closest('[data-node]');
  if (nodeBtn){ selectNode(nodeBtn.dataset.node); centerOn(nodeBtn.dataset.node, true); return; }
  const back = ev.target.closest('[data-back]');
  if (back){ clearSelection(); return; }
  const step = ev.target.closest('[data-step]');
  if (step){ focusStep(Number(step.dataset.step)); }
});
el.search.addEventListener('input', () => { if (!state.flow) renderPanel(); });
el.tabFlows.addEventListener('click', () => setTab('flows'));
el.tabDetail.addEventListener('click', () => setTab('detail'));
document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.2));
document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.2));
document.getElementById('zoom-fit').addEventListener('click', () => fit());
document.getElementById('btn-reset').addEventListener('click', () => { clearSelection(); fit(); });
document.getElementById('btn-json').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'faccicare-arquitectura.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ clearSelection(); hideTip(); }
  if (ev.key === '/' && document.activeElement !== el.search){
    ev.preventDefault(); setTab('flows'); el.search.focus();
  }
  if (state.flow && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && document.activeElement !== el.search){
    const f = FLOWS.find(x => x.id === state.flow);
    if (!f) return;
    ev.preventDefault();
    const next = (state.step == null ? 0 : state.step + (ev.key === 'ArrowDown' ? 1 : -1));
    focusStep(Math.max(0, Math.min(f.steps.length - 1, next)));
  }
});
function refit(){
  const f = FLOWS.find(x => x.id === state.flow);
  if (f) fitTo(f.steps.map(s => s.node), 70, 1.35); else fit();
}
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(refit, 160); });

/* ── Arranque ─────────────────────────────────────────────── */
renderBands();
renderEdges();
renderNodes();
buildKinds();
buildLegend();
buildStats();
paint();
renderPanel();
// El encuadre necesita la altura definitiva del lienzo: espera al primer pintado.
requestAnimationFrame(() => requestAnimationFrame(fit));
window.addEventListener('load', () => setTimeout(refit, 60));
})();
</script>
</body>
</html>
