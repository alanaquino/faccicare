{% extends "layouts/base.html" %}
{% block title %}Registrar egreso — {{ estancia.codigo }}{% endblock %}
{% block content %}

<div class="flex items-center gap-4">
  <a href="{% url 'alojamiento:detalle' estancia.pk %}" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
    <span class="material-symbols-outlined">arrow_back</span>
  </a>
  <div>
    <h2 class="font-headline-lg text-headline-lg text-on-background">Registrar egreso</h2>
    <p class="font-body-md text-body-md text-on-surface-variant">
      {{ estancia.paciente.nombre_completo }} — {{ estancia.habitacion.nombre }} ({{ estancia.codigo }})
    </p>
  </div>
</div>

<div class="max-w-lg mt-6">
  <form method="post" class="bg-surface-container-lowest rounded-xl shadow-sm border border-surface-container p-6 space-y-5">
    {% csrf_token %}
    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Fecha de egreso</label>
      <input type="date" name="fecha_egreso" value="{{ hoy }}" required
             class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary/50 font-body-md text-body-md">
    </div>
    <div>
      <label class="block font-label-md text-label-md text-on-surface mb-1.5">Observaciones de egreso</label>
      <textarea name="observaciones_egreso" rows="3"
                class="w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface focus:outline-none focus:ring-2 focus:ring-primary/50 font-body-md text-body-md"
                placeholder="Motivo del egreso, condición al salir…"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" name="accion" value="completar"
              class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity shadow-sm">
        <span class="material-symbols-outlined">task_alt</span>Completar estancia
      </button>
      <button type="submit" name="accion" value="cancelar"
              class="inline-flex items-center justify-center gap-2 px-4 py-3 rounded-lg border border-error/40 text-error font-label-md text-label-md hover:bg-error-container/20 transition-colors">
        <span class="material-symbols-outlined" style="font-size:18px;">cancel</span>Cancelar
      </button>
    </div>
  </form>
</div>

{% endblock %}
