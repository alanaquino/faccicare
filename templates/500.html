<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Error del servidor — FACCI Care</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #f5faff; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="text-center max-w-md">
    <span class="material-symbols-outlined text-8xl text-red-300 block mb-4">error</span>
    <h1 class="text-6xl font-bold text-red-800 mb-2" style="font-family: 'Manrope', sans-serif;">500</h1>
    <h2 class="text-xl font-semibold text-slate-700 mb-3">Error interno del servidor</h2>
    <p class="text-slate-500 mb-8">Ocurrió un problema inesperado. El equipo técnico ha sido notificado. Por favor intenta de nuevo en unos minutos.</p>
    <div class="flex gap-3 justify-center">
      <a href="javascript:location.reload()"
         class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full border border-slate-300 text-slate-600 font-medium hover:bg-slate-100 transition-colors">
        <span class="material-symbols-outlined text-base">refresh</span>
        Reintentar
      </a>
      <a href="/"
         class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-blue-600 text-white font-medium hover:bg-blue-700 transition-colors">
        <span class="material-symbols-outlined text-base">home</span>
        Inicio
      </a>
    </div>
    <p class="mt-10 text-xs text-slate-400">FACCI Care — Sistema de Gestión Clínica Pediátrica</p>
  </div>
</body>
</html>
