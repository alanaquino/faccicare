{# ===== FILA DE PACIENTE EN TABLA ===== #}
{# Uso: {% include "components/cards/patient_row.html" with p=paciente %} #}
<tr class="hover:bg-surface/50 transition-colors">
  <td class="p-4">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-xs shrink-0">
        {{ p.iniciales }}
      </div>
      <div>
        <p class="font-medium text-on-background">{{ p.nombre }}</p>
        <p class="text-xs text-on-surface-variant">{{ p.edad }}</p>
      </div>
    </div>
  </td>
  <td class="p-4 text-on-surface-variant font-body-sm text-body-sm">{{ p.fecha }}</td>
  <td class="p-4">
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium whitespace-nowrap
      {% if p.estado_color == 'error' %}bg-error-container text-on-error-container
      {% elif p.estado_color == 'tertiary' %}bg-tertiary-fixed text-on-tertiary-fixed
      {% elif p.estado_color == 'secondary' %}bg-secondary-fixed text-on-secondary-fixed
      {% else %}bg-surface-container text-on-surface-variant{% endif %}">
      {{ p.estado }}
    </span>
  </td>
  <td class="p-4 font-body-sm text-body-sm text-on-surface-variant">{{ p.prioridad }}</td>
  <td class="p-4 text-right">
    <a href="{% url 'pacientes:expediente' p.id %}" aria-label="Ver detalles"
       class="text-primary hover:text-primary-container transition-colors p-1 inline-block">
      <span class="material-symbols-outlined text-xl">visibility</span>
    </a>
  </td>
</tr>
