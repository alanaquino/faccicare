<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FACCI Care — Estado del sistema</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { font-family: 'Inter', sans-serif; background: #f5faff; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen">
  <header class="bg-teal-800 text-white px-10 py-7">
    <h1 class="text-2xl font-bold" style="font-family: 'Manrope', sans-serif;">FACCI Care</h1>
    <p class="text-teal-200 text-sm mt-1">Sistema de Gestión Clínica Pediátrica</p>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8">
    <div class="flex items-center gap-2 mb-6">
      <span class="material-symbols-outlined text-green-500">check_circle</span>
      <span class="font-medium text-slate-700">Sistema operativo — Backend Django, API REST y Admin activos.</span>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">
      {% for stat in stats %}
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <p class="text-xs text-slate-500 uppercase tracking-wide">{{ stat.label }}</p>
        <p class="text-3xl font-bold text-teal-700 mt-1" style="font-family: 'Manrope', sans-serif;">{{ stat.valor }}</p>
      </div>
      {% endfor %}
    </div>

    <div class="flex flex-wrap gap-3">
      <a href="/admin/" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm hover:bg-slate-50 shadow-sm">
        <span class="material-symbols-outlined text-base">admin_panel_settings</span> Admin Django
      </a>
      <a href="/api/docs/" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm hover:bg-slate-50 shadow-sm">
        <span class="material-symbols-outlined text-base">api</span> Swagger / Docs
      </a>
      <a href="/api/token/" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm hover:bg-slate-50 shadow-sm">
        <span class="material-symbols-outlined text-base">key</span> Token JWT
      </a>
      <a href="/api/mensajes/notificaciones/conteo/" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm hover:bg-slate-50 shadow-sm">
        <span class="material-symbols-outlined text-base">notifications</span> API Mensajes
      </a>
    </div>
  </main>
</body>
</html>
